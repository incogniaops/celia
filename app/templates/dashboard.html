<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>celia — Dashboard</title>
  <script>
    document.documentElement.setAttribute("data-theme", localStorage.getItem("celia-theme") || "dark");
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    .chart-wrap { position: relative; height: 320px; margin-bottom: 1.5rem; }
    .biometric-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .biometric-cards article { margin: 0; text-align: center; }
    .biometric-cards .value { font-size: 1.5rem; font-weight: 600; }
    .biometric-cards small { color: var(--pico-muted-color); }
  </style>
</head>
<body>
  <button onclick="celiaToggleTheme()" aria-label="Toggle dark/light theme" style="position: fixed; top: 1rem; right: 1rem; z-index: 10;">🌓</button>
  <main class="container">
    <h1>celia</h1>
    <div id="dashboard-content">
      {% include "dashboard_content.html" %}
    </div>
  </main>
  <script>
    function celiaToggleTheme() {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("celia-theme", next);
    }
  </script>
</body>
</html>
